<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام بصمة الحضور والانصراف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #007bff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .msg { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>نظام بصمة</h2>
    
    <div class="form-group">
        <label>اختر الموظف:</label>
        <select id="employeeSelect">
            <option value="">جاري تحميل الموظفين...</option>
        </select>
    </div>

    <div class="form-group">
        <label>نوع الحركة:</label>
        <select id="punchType">
            <option value="حضور">حضور</option>
            <option value="انصراف">انصراف</option>
        </select>
    </div>

    <button onclick="submitPunch()">تسجيل البصمة</button>
    <div class="msg" id="msg"></div>
</div>

<script>
    // رابط السكريبت الخاص بك المربوط بقاعدة البيانات
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAThk-3P7ymKvEwDJ-6GL7gzxTzLQV0KSvrmbRGiOipzFMTr2dij8kb88upo-9tMcl/exec';

    window.onload = function() {
        loadEmployees();
    };

    function loadEmployees() {
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "syncAll" })
        })
        .then(res => res.json())
        .then(data => {
            let select = document.getElementById('employeeSelect');
            select.innerHTML = '<option value="">اختر موظف...</option>';
            if (data.employees && data.employees.length > 0) {
                data.employees.forEach(emp => {
                    let opt = document.createElement('option');
                    opt.value = emp.name;
                    opt.textContent = emp.name;
                    select.appendChild(opt);
                });
            }
        })
        .catch(err => {
            console.error("خطأ في التحميل", err);
        });
    }

    function submitPunch() {
        let name = document.getElementById('employeeSelect').value;
        let type = document.getElementById('punchType').value;
        let msg = document.getElementById('msg');

        if (!name) {
            msg.style.color = "red";
            msg.textContent = "الرجاء اختيار الموظف!";
            return;
        }

        let now = new Date();
        let date = now.toISOString().split('T')[0];
        let time = now.toLocaleTimeString();

        msg.style.color = "blue";
        msg.textContent = "جاري الحفظ...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "punch", name: name, type: type, date: date, time: time })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                msg.style.color = "green";
                msg.textContent = "تم تسجيل البصمة بنجاح!";
            } else {
                msg.style.color = "red";
                msg.textContent = "حدث خطأ أثناء الحفظ.";
            }
        })
        .catch(err => {
            msg.style.color = "red";
            msg.textContent = "خطأ في الاتصال بالشبكة.";
        });
    }
</script>

</body>
</html>
